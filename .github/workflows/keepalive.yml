# Backup keep-alive: free Supabase projects pause after a week without requests. The main
# keep-alive is the Google Sheet sync (every 10 minutes); this daily ping covers the time
# before the Sheet is set up or if its trigger stops.
#
# GitHub disables scheduled workflows in repositories with no commits for 60 days: re-enable
# it from the Actions tab if that happens (do not rely on this workflow alone).
name: Keep-alive

on:
  schedule:
    - cron: '17 13 * * *' # every day, 08:17 in Lima
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Missing repository variables VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          answer=$(curl --silent --show-error --fail-with-body --retry 3 --retry-delay 10 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "ping → $answer"
          test "$answer" = "1"
